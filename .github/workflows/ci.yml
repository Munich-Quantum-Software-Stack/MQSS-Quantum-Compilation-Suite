name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [develop]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Step 1: Checkout repo (gives us the Dockerfile)
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive

      # Cache the CMake build dir (build/_deps and friends) so unchanged dependencies
      # that still fetch+build from source at configure time (MQT-Core, MQT-QMAP, QDMI --
      # LLVM/CUDA-Q/Catalyst instead come prebuilt from DEPS_IMAGE above) aren't rebuilt
      # from scratch every run -- only invalidated when the Dockerfile or the CMake files
      # that pin dependency versions change, not by changes to our own source.
      - name: Cache CMake build directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/_deps
          key:
            build-${{ runner.os }}-${{ hashFiles('.devcontainer/Dockerfile', 'CMakeLists.txt',
            'cmake/**') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af

      # Compute the exact deps image tag these pins map to, so CI never drifts from
      # .devcontainer/Dockerfile's own hardcoded default ARG -- if someone bumps a pin
      # here without deps-image.yml having published a matching tag yet, this fails
      # loudly on a missing manifest instead of silently building against a
      # stale/mismatched deps image.
      - name: Compute deps image tag
        id: deps_vars
        uses: ./.github/actions/compute-deps-image-tag

      # GHCR images pushed with GITHUB_TOKEN are private by default, so the
      # docker build below needs to authenticate to pull DEPS_IMAGE even
      # though it's coming from this same repo's own package registry.
      - name: Log in to GHCR
        run:
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}"
          --password-stdin

      # Step 2: Build Docker image using relative path
      - name: Build Docker image
        run: |
          docker build --build-arg CMAKE_ARCH=x86_64 \
           --build-arg DEPS_IMAGE="${STEPS_DEPS_VARS_OUTPUTS_IMAGE}" \
           --progress=plain -t mqss-pass-dev -f .devcontainer/Dockerfile .
        env:
          STEPS_DEPS_VARS_OUTPUTS_IMAGE: ${{ steps.deps_vars.outputs.image }}

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspaces/MQSS-Quantum-Compilation-Suite" \
            -w /workspaces/MQSS-Quantum-Compilation-Suite \
            mqss-pass-dev \
            bash -lc '
              git config --global --add safe.directory "*"
              make build
              make target
            '

      - name: Run Tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspaces/MQSS-Quantum-Compilation-Suite \
            -w /workspaces/MQSS-Quantum-Compilation-Suite \
            mqss-pass-dev \
            bash -lc '
            export PATH="/workspaces/MQSS-Quantum-Compilation-Suite/build/bin:$PATH"
            which mqss-opt
            make test-dialects
            make test-interfaces '

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write # Codecov upload via OIDC
    steps:
      # Step 1: Checkout repo (gives us the Dockerfile)
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive

      # Cache the CMake build dir (build/_deps and friends) so unchanged dependencies
      # that still fetch+build from source at configure time (MQT-Core, MQT-QMAP, QDMI --
      # LLVM/CUDA-Q/Catalyst instead come prebuilt from DEPS_IMAGE above) aren't rebuilt
      # from scratch every run -- only invalidated when the Dockerfile or the CMake files
      # that pin dependency versions change, not by changes to our own source.
      - name: Cache CMake build directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/_deps
          key:
            build-${{ runner.os }}-${{ hashFiles('.devcontainer/Dockerfile', 'CMakeLists.txt',
            'cmake/**') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af

      # Compute the exact deps image tag these pins map to, so CI never drifts from
      # .devcontainer/Dockerfile's own hardcoded default ARG -- if someone bumps a pin
      # here without deps-image.yml having published a matching tag yet, this fails
      # loudly on a missing manifest instead of silently building against a
      # stale/mismatched deps image.
      - name: Compute deps image tag
        id: deps_vars
        uses: ./.github/actions/compute-deps-image-tag

      # GHCR images pushed with GITHUB_TOKEN are private by default, so the
      # docker build below needs to authenticate to pull DEPS_IMAGE even
      # though it's coming from this same repo's own package registry.
      - name: Log in to GHCR
        run:
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}"
          --password-stdin

      # Step 2: Build Docker image using relative path
      - name: Build Docker image
        run: |
          docker build --build-arg CMAKE_ARCH=x86_64 \
           --build-arg DEPS_IMAGE="${STEPS_DEPS_VARS_OUTPUTS_IMAGE}" \
           --progress=plain -t mqss-pass-dev -f .devcontainer/Dockerfile .
        env:
          STEPS_DEPS_VARS_OUTPUTS_IMAGE: ${{ steps.deps_vars.outputs.image }}

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspaces/MQSS-Quantum-Compilation-Suite" \
            -w /workspaces/MQSS-Quantum-Compilation-Suite \
            -e CFLAGS=--coverage -e CXXFLAGS=--coverage -e LDFLAGS=--coverage \
            mqss-pass-dev \
            bash -lc '
              git config --global --add safe.directory "*"
              make build
              make target
            '

      - name: Run Tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspaces/MQSS-Quantum-Compilation-Suite \
            -w /workspaces/MQSS-Quantum-Compilation-Suite \
            mqss-pass-dev \
            bash -lc '
            export PATH="/workspaces/MQSS-Quantum-Compilation-Suite/build/bin:$PATH"
            which mqss-opt
            make test-dialects
            make test-interfaces
            python3 -m pip install --break-system-packages gcovr 2>/dev/null || python3 -m pip install gcovr
            gcovr --root . --filter lib/ --filter include/ --xml coverage.xml --print-summary build '

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Switch to true (as in QDMI) once the repository is registered with Codecov.
          fail_ci_if_error: false
          files: coverage.xml
          flags: cpp

  required-checks-pass: # This job does nothing and is only used for branch protection
    name: 🚦 Check
    if: always()
    needs:
      - build-and-test
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
