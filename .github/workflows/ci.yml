name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repo (gives us the Dockerfile)
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Cache the CMake build dir (build/_deps and friends) so unchanged dependencies
      # (LLVM toolchain fetch, CUDA-Q, Catalyst, MQT-Core, MQT-QMAP, QDMI) aren't rebuilt
      # from scratch every run -- only invalidated when the Dockerfile or the CMake files
      # that pin dependency versions change, not by changes to our own source.
      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: build
          key:
            build-${{ runner.os }}-${{ hashFiles('.devcontainer/Dockerfile', 'CMakeLists.txt',
            'cmake/**') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af

      # Step 2: Build Docker image using relative path
      - name: Build Docker image
        run: |
          docker build --build-arg CMAKE_ARCH=x86_64 \
           --progress=plain -t mqss-pass-dev -f .devcontainer/Dockerfile .

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspaces/MQSS-Quantum-Compilation-Suite" \
            -w /workspaces/MQSS-Quantum-Compilation-Suite \
            mqss-pass-dev \
            bash -lc '
              make build
              make target
            '

      - name: Run Tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspaces/MQSS-Quantum-Compilation-Suite \
            -w /workspaces/MQSS-Quantum-Compilation-Suite \
            mqss-pass-dev \
            bash -lc '
            export PATH="/workspaces/MQSS-Quantum-Compilation-Suite/build/bin:$PATH"
            which mqss-opt
            make test-dialects
            make test-interfaces '
